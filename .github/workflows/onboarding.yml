name: Onboarding contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: node --test scripts/onboarding/*.test.mjs
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: yarn test:onboarding
