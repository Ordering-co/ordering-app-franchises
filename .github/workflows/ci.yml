name: Quality checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: node --test scripts/onboarding/*.test.mjs
      - run: yarn test:onboarding
      - run: yarn i18n:verify
      - run: yarn i18n:check-generated
      - run: yarn lint:check
      - run: yarn test:coverage --runInBand --watchman=false
      - run: node scripts/coverage-summary.js --no-run --strict
